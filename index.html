<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisCom Student Survival Test | 视传生生存检测</title>
    <style>
        :root {
            --bg-color: #F0F0F2;
            --card-bg: #FFFFFF;
            --text-main: #000000;
            --text-sub: #666666;
            --accent-color: #0044FF; /* 国际克莱因蓝 */
            --accent-neon: #CCFF00; /* 酸性绿 */
            --font-stack: "Helvetica Neue", Helvetica, "PingFang SC", sans-serif;
            --mono-font: "Menlo", "Courier New", monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(#ddd 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* 容器 */
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 2px solid #000;
            box-shadow: 8px 8px 0px #000; /* 这种硬阴影很符合设计系审美 */
            overflow: hidden;
            position: relative;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
        }

        /* 顶部进度条 */
        .progress-bar {
            height: 8px;
            background: #fff;
            border-bottom: 2px solid #000;
            width: 100%;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.3s steps(10); /* 像素感过渡 */
        }

        .content-area {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 1. 欢迎页 */
        .welcome-screen { text-align: center; }
        .hero-emoji { font-size: 70px; margin-bottom: 20px; display:inline-block; animation: shake 3s infinite; }
        h1 { font-size: 36px; font-weight: 900; line-height: 1.1; margin-bottom: 10px; letter-spacing: -1px; }
        .subtitle { font-size: 14px; font-family: var(--mono-font); color: #666; margin-bottom: 30px; background: #eee; display: inline-block; padding: 5px 10px; }
        
        .warning-box {
            border: 1px dashed #000;
            padding: 20px;
            text-align: left;
            font-size: 13px;
            margin-bottom: 30px;
            background: #FFFAEA;
        }
        .warning-box strong { display: block; margin-bottom: 8px; font-size: 14px; }

        .btn-start {
            background: #000;
            color: #fff;
            border: none;
            padding: 18px 40px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s;
            border-radius: 50px;
        }
        .btn-start:hover { background: var(--accent-color); transform: scale(1.02); }
        .btn-start:active { transform: scale(0.95); }

        /* 2. 模拟加载 (Terminal) */
        .loading-screen {
            display: none;
            background: #000;
            color: #0f0;
            font-family: var(--mono-font);
            padding: 30px;
            height: 100%;
            font-size: 12px;
            line-height: 1.8;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow-y: auto;
        }
        .log-line { margin-bottom: 5px; opacity: 0; animation: fadeTyping 0.1s forwards; }

        /* 3. 问题页 */
        .quiz-container { display: none; animation: slideIn 0.4s ease; }
        .q-tag { font-family: var(--mono-font); font-size: 12px; color: var(--accent-color); font-weight: bold; margin-bottom: 15px; display: block; }
        .q-text { font-size: 20px; font-weight: 800; line-height: 1.5; margin-bottom: 25px; }
        
        .option-card {
            background: #fff;
            border: 2px solid #eee;
            padding: 15px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 15px;
            border-radius: 8px;
        }
        .option-card:hover { border-color: #000; background: #F7F7F7; transform: translateX(5px); }
        .option-card:active { background: #000; color: #fff; border-color: #000; }

        /* 4. 结果页 */
        .result-container { display: none; text-align: center; }
        .res-badge { background: #000; color: #fff; padding: 5px 12px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 15px; border-radius: 20px; }
        .res-title { font-size: 32px; font-weight: 900; margin-bottom: 20px; line-height: 1.2; }
        .res-desc { text-align: left; background: #F2F2F2; padding: 25px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
        .res-abroad { border: 2px solid var(--accent-color); padding: 15px; color: var(--accent-color); font-weight: bold; margin-bottom: 20px; border-radius: 10px; font-size: 14px;}

        /* 动画 */
        @keyframes shake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(10deg); } 75% { transform: rotate(-10deg); } }
        @keyframes fadeTyping { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 480px) {
            .container { height: 100vh; border: none; border-radius: 0; box-shadow: none; }
            .content-area { padding: 20px; }
            h1 { font-size: 28px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

    <div class="content-area">
        
        <!-- 1. 欢迎页 -->
        <div class="welcome-screen" id="view-welcome">
            <div class="hero-emoji">👁️🧠💻</div>
            <h1>视传生<br>生存状态检测</h1>
            <div class="subtitle">v7.0_Beta_Final_Revise.html</div>
            
            <div class="warning-box">
                <strong>⚠️ 适用人群：视觉传达 / 数字媒体 / 艺术设计</strong>
                • 本测试包含：毕设焦虑、打印店色差、甲方审美等敏感内容。
                <br>• 可能会引起心率过速或想要“退学”的冲动。
                <br>• 建议在非 Deadline 期间进行测试。
            </div>

            <button class="btn-start" onclick="startLoading()">开始显影</button>
        </div>

        <!-- 2. Terminal 加载 -->
        <div class="loading-screen" id="view-loading">
            <!-- JS 写入日志 -->
        </div>

        <!-- 3. 问题区 -->
        <div class="quiz-container" id="view-quiz">
            <span class="q-tag">FILE: QUESTION_<span id="q-num">01</span></span>
            <div class="q-text" id="q-text"></div>
            <div id="q-options"></div>
        </div>

        <!-- 4. 结果区 -->
        <div class="result-container" id="view-result">
            <div class="res-badge" id="res-type">TYPE</div>
            <h2 class="res-title" id="res-title"></h2>
            <div class="res-desc" id="res-desc"></div>
            <div class="res-abroad" id="res-abroad"></div>
            <button class="btn-start" onclick="location.reload()" style="font-size:14px; padding:12px 30px;">CMD+Z (重测)</button>
        </div>

    </div>
</div>

<script>
    // --- 视传生专属加载日志 ---
    const logs = [
        "Initializing Adobe Creative Cloud (Not Responding)...",
        "Loading fonts... [Comic Sans] detected and deleted.",
        "正在检测发际线后移速度...",
        "正在连接打印店老板的蓝牙...",
        "RGB转CMYK中... 颜色已变灰...",
        "正在编造毕设的设计理念...",
        "正在计算综测排名...",
        "正在尝试理解老师说的“设计感”...",
        "System ready. Welcome, Designer."
    ];

    // --- 15道 视传生专属题库 ---
    // score: { art: 艺术/感性/混乱, logic: 逻辑/规范/UI, global: 理论/深造/概念 }
    const questions = [
        {
            q: "Q1. 电脑桌面上的文件命名，你是哪一派？",
            options: [
                { text: "A. `未标题-1`, `未标题-2`, `asd.jpg`, `111.png` (随缘派)", scores: { art: 3, logic: -2, global: 0 } },
                { text: "B. `作业_v1`, `作业_v2`, `作业_打死不改`, `作业_打印版` (发疯派)", scores: { art: 2, logic: 0, global: 0 } },
                { text: "C. `2025_CourseA_Project_Final_v1.0` (学霸规范派)", scores: { art: 0, logic: 3, global: 1 } },
                { text: "D. 桌面？我没有桌面，全是文件把壁纸挡住了。", scores: { art: 1, logic: -1, global: 0 } }
            ]
        },
        {
            q: "Q2. 去打印店打海报，看到出来的颜色灰了一大截 (RGB变CMYK)，你会？",
            options: [
                { text: "A. 当场崩溃，这就是我毕设不及格的原因。", scores: { art: 1, logic: 0, global: 0 } },
                { text: "B. 淡定。早就预料到了，我做图时一直开着色域警告。", scores: { art: 0, logic: 3, global: 0 } },
                { text: "C. 跟老板说：“这是复古做旧风格，故意这样的。” (强行解释)", scores: { art: 2, logic: 1, global: 2 } },
                { text: "D. 只要不偏色成绿色，我就能忍。", scores: { art: 0, logic: 1, global: -1 } }
            ]
        },
        {
            q: "Q3. 老师布置了一个作业：“设计一个关于未来的字体”，你会？",
            options: [
                { text: "A. 把现在的黑体字拉伸、扭曲、加液化 (Acid风格)。", scores: { art: 3, logic: -1, global: 1 } },
                { text: "B. 用 Processing 或 Python 写代码生成随机字形。", scores: { art: 0, logic: 4, global: 2 } },
                { text: "C. 乖乖手绘一套美术字，然后扫描进电脑描边。", scores: { art: 2, logic: 1, global: 0 } },
                { text: "D. 上网找个冷门字体下载，改改笔画交差。", scores: { art: 0, logic: 0, global: -2 } }
            ]
        },
        {
            q: "Q4. 【深造判定】《中外设计史》这种纯理论课，你的状态是？",
            options: [
                { text: "A. 睡得昏天黑地，不知道包豪斯是啥。", scores: { art: 0, logic: 0, global: -2 } },
                { text: "B. 在下面偷偷画自己的图/修图。", scores: { art: 2, logic: 0, global: 0 } },
                { text: "C. 听得很认真，觉得这些主义和流派很有意思。", scores: { art: 0, logic: 1, global: 5 } },
                { text: "D. 考前突击背书，为了刷绩点保研。", scores: { art: 0, logic: 3, global: -1 } }
            ]
        },
        {
            q: "Q5. 做小组作业 (Group Project) 时，你最怕遇到哪种队友？",
            options: [
                { text: "A. “我不懂软件，我负责找资料吧” (最后找的全是百度图片)。", scores: { art: 1, logic: 1, global: 0 } },
                { text: "B. 审美极为恐怖，做出来的 PPT 像椰树椰汁。", scores: { art: 2, logic: 0, global: 0 } },
                { text: "C. 消失人口。只有答辩那天才会出现。", scores: { art: 0, logic: 2, global: 0 } },
                { text: "D. 也就是我本人，我只想抱大腿。", scores: { art: 0, logic: 0, global: -1 } }
            ]
        },
        {
            q: "Q6. 在做作品集 (Portfolio) 的“设计说明”时，你通常怎么写？",
            options: [
                { text: "A. 瞎编。“这个圆代表了宇宙的混沌与秩序...”", scores: { art: 2, logic: 0, global: 1 } },
                { text: "B. 实话实说。“觉得好看就这么画了。”", scores: { art: 3, logic: -1, global: -2 } },
                { text: "C. 引用哲学术语，什么“解构”、“后人类”、“拟像”。", scores: { art: 1, logic: 0, global: 5 } },
                { text: "D. 逻辑清晰：背景-调研-痛点-解决方案。", scores: { art: 0, logic: 4, global: 2 } }
            ]
        },
        {
            q: "Q7. 面对 AI (Midjourney/Stable Diffusion)，你的心态是？",
            options: [
                { text: "A. 偷懒神器！作业素材全靠它生成。", scores: { art: 0, logic: 2, global: -1 } },
                { text: "B. 焦虑。感觉还没毕业就要失业了。", scores: { art: 1, logic: 0, global: 0 } },
                { text: "C. 兴奋。正在研究怎么用 AI 辅助我的毕设。", scores: { art: 0, logic: 3, global: 2 } },
                { text: "D. 鄙视。这种拼贴缝合怪没有灵魂。", scores: { art: 4, logic: 0, global: 1 } }
            ]
        },
        {
            q: "Q8. 【深造判定】如果给你机会去国外顶尖院校 (RCA/UAL) 交换一年：",
            options: [
                { text: "A. 必须去！就算卖肾也要去看看外面的世界。", scores: { art: 1, logic: 0, global: 6 } },
                { text: "B. 不去。国外不安全，而且好贵，不如在国内实习。", scores: { art: 0, logic: 2, global: -3 } },
                { text: "C. 如果能帮我镀金，回来好进大厂，我就去。", scores: { art: 0, logic: 3, global: 0 } },
                { text: "D. 去旅游还可以，去读书就算了，雅思太难考。", scores: { art: 1, logic: 0, global: -1 } }
            ]
        },
        {
            q: "Q9. 做 UI 界面作业时，你对“像素对齐”的态度是？",
            options: [
                { text: "A. 必须完美对齐！间距必须是 4 或 8 的倍数！", scores: { art: 0, logic: 5, global: 0 } },
                { text: "B. 差不多得了，肉眼看不出来就行。", scores: { art: 2, logic: -1, global: 0 } },
                { text: "C. 我做的是概念设计，不需要对齐，要的是氛围。", scores: { art: 3, logic: 0, global: 2 } },
                { text: "D. 全程用自动布局 (Auto Layout)，根本不需要手动对。", scores: { art: 0, logic: 4, global: 1 } }
            ]
        },
        {
            q: "Q10. 熬夜画图时的续命饮料是？",
            options: [
                { text: "A. 冰美式 (血液里流淌着咖啡)。", scores: { art: 1, logic: 1, global: 1 } },
                { text: "B. 奶茶 (全糖，为了快乐)。", scores: { art: 2, logic: 0, global: 0 } },
                { text: "C. 红牛/东鹏特饮 (为了活着)。", scores: { art: 0, logic: 2, global: -1 } },
                { text: "D. 养生茶/白开水 (因为怕猝死)。", scores: { art: 0, logic: 1, global: 0 } }
            ]
        },
        {
            q: "Q11. 看到那种“新丑风 (New Ugly)”或“酸性设计”海报，你会？",
            options: [
                { text: "A. 欣赏不来，感觉像软件乱码了。", scores: { art: 0, logic: 2, global: -1 } },
                { text: "B. 太酷了！我也想试试这种离经叛道的风格。", scores: { art: 3, logic: -1, global: 2 } },
                { text: "C. 分析它的版式结构，觉得是对此前极简风的反叛。", scores: { art: 1, logic: 1, global: 4 } },
                { text: "D. 只有做个人作业才敢这么搞，给老师看会被骂死。", scores: { art: 1, logic: 1, global: 0 } }
            ]
        },
        {
            q: "Q12. 临近毕业，你最理想的去向是？",
            options: [
                { text: "A. 进互联网大厂做 UI/UX，年薪 30w+。", scores: { art: 0, logic: 4, global: -1 } },
                { text: "B. 出国深造，读个 MFA，走学术或艺术家路线。", scores: { art: 1, logic: 0, global: 5 } },
                { text: "C. 考编/考公/当老师，稳定压倒一切。", scores: { art: -1, logic: 1, global: -3 } },
                { text: "D. 自由职业/数字游民，一边旅游一边接单。", scores: { art: 4, logic: 0, global: 1 } }
            ]
        },
        {
            q: "Q13. 老师说：“这张图感觉不对，再改改。” 你会？",
            options: [
                { text: "A. “好的老师。” (回去根本没改，第二天再发给他)", scores: { art: 1, logic: 1, global: -1 } },
                { text: "B. 追问：“具体哪里不对？构图？色彩？还是字体？”", scores: { art: 0, logic: 3, global: 1 } },
                { text: "C. 焦虑地改了一通宵，改出了 10 个版本。", scores: { art: 1, logic: 0, global: 0 } },
                { text: "D. 试图用设计理论说服老师，证明我是对的。", scores: { art: 2, logic: 1, global: 3 } }
            ]
        },
        {
            q: "Q14. 你认为学视觉传达，最重要的能力是？",
            options: [
                { text: "A. 审美天赋。没天赋再努力也没用。", scores: { art: 4, logic: -1, global: 1 } },
                { text: "B. 软件技术。C4D、AE 玩得溜才是王道。", scores: { art: 0, logic: 3, global: -1 } },
                { text: "C. 逻辑思维。能发现问题并解决问题。", scores: { art: 0, logic: 4, global: 1 } },
                { text: "D. 讲故事的能力 (Storytelling)。", scores: { art: 2, logic: 0, global: 3 } }
            ]
        },
        {
            q: "Q15. 最后，如果下辈子还让你选专业，你选？",
            options: [
                { text: "A. 狗都不学设计。我要学计算机/金融。", scores: { art: 0, logic: 1, global: -2 } },
                { text: "B. 还是会学设计，因为我除了画画啥也不会。", scores: { art: 4, logic: 0, global: 1 } },
                { text: "C. 想学纯艺术 (Fine Art)，彻底放飞自我。", scores: { art: 3, logic: -1, global: 4 } },
                { text: "D. 学心理学或社会学，做用户研究。", scores: { art: 0, logic: 3, global: 3 } }
            ]
        }
    ];

    // --- 逻辑控制 ---
    
    let currentStep = 0;
    let scores = { art: 0, logic: 0, global: 0 };

    function startLoading() {
        document.getElementById('view-welcome').style.display = 'none';
        const loadingDiv = document.getElementById('view-loading');
        loadingDiv.style.display = 'block';

        let lineIndex = 0;
        
        function addLine() {
            if (lineIndex < logs.length) {
                const p = document.createElement('div');
                p.className = 'log-line';
                p.innerText = "> " + logs[lineIndex];
                loadingDiv.appendChild(p);
                loadingDiv.scrollTop = loadingDiv.scrollHeight;
                lineIndex++;
                setTimeout(addLine, Math.random() * 300 + 200); 
            } else {
                setTimeout(startQuiz, 800);
            }
        }
        addLine();
    }

    function startQuiz() {
        document.getElementById('view-loading').style.display = 'none';
        document.getElementById('view-quiz').style.display = 'block';
        renderQuestion();
    }

    function renderQuestion() {
        const qData = questions[currentStep];
        
        // 进度
        const percent = ((currentStep) / questions.length) * 100;
        document.getElementById('progress').style.width = percent + '%';
        
        document.getElementById('q-num').innerText = (currentStep + 1).toString().padStart(2, '0');
        document.getElementById('q-text').innerText = qData.q;
        
        const optionsHtml = qData.options.map((opt, idx) => `
            <div class="option-card" onclick="selectOption(${idx})">
                ${opt.text}
            </div>
        `).join('');
        document.getElementById('q-options').innerHTML = optionsHtml;
    }

    function selectOption(idx) {
        const s = questions[currentStep].options[idx].scores;
        scores.art += s.art;
        scores.logic += s.logic;
        scores.global += s.global;

        currentStep++;

        if (currentStep >= questions.length) {
            document.getElementById('progress').style.width = '100%';
            showResult();
        } else {
            renderQuestion();
        }
    }

    // --- 结果计算 (学生版逻辑) ---
    function showResult() {
        document.getElementById('view-quiz').style.display = 'none';
        document.getElementById('view-result').style.display = 'block';

        let rType, rTitle, rDesc, rAbroad;

        // 1. 学术/深造大神 (Global >= 18)
        if (scores.global >= 18) {
            rType = "THE ACADEMIC";
            rTitle = "学院派·思辨哲学家";
            rDesc = "你可能是全班唯一认真听《设计史》的人。你关注设计的社会意义多过视觉表现。国内的功利教育环境真的委屈你了。你天生适合去 RCA, UAL 或 耶鲁 读研，研究那些听起来很玄乎但很高级的课题。";
            rAbroad = "✈️ <strong>深造建议：必须出国！</strong> 国内环境容不下你的脑洞。快去准备作品集吧！";
        }
        
        // 2. 卷王/UI大厂预备役 (Logic > Art + 5)
        else if (scores.logic > scores.art + 5) {
            rType = "THE SYSTEMIZER";
            rTitle = "像素秩序·大厂卷王";
            rDesc = "你是小组作业的大腿，文件管理的洁癖患者。你痛恨乱七八糟的图层。你非常适合做 UI/UX 或 B端产品设计。你的未来在互联网大厂，年薪可观，虽然头发可能保不住。";
            rAbroad = "💼 <strong>深造建议：以就业为导向。</strong> 除非去美国学 HCI (人机交互)，否则不如直接去大厂实习。";
        }

        // 3. 野生艺术家 (Art > Logic + 5)
        else if (scores.art > scores.logic + 5) {
            rType = "THE ARTIST";
            rTitle = "野生天才·偏科战神";
            rDesc = "你经常迟到，作业经常踩点交，但你的作品总能让老师眼前一亮。你靠直觉做设计，逻辑对你来说是枷锁。别去大厂做螺丝钉，去画插画、做动态视觉、或者搞独立品牌吧！";
            rAbroad = "🌍 <strong>深造建议：看城市氛围。</strong> 适合去伦敦、柏林这种艺术氛围浓厚的地方游学。";
        }

        // 4. 现实主义者/想转行 (Global <= -3)
        else if (scores.global <= -3) {
            rType = "THE REALIST";
            rTitle = "人间清醒·想转行";
            rDesc = "你早就看透了设计专业的坑：熬夜多、钱少、甲方事多。你学设计可能纯属误会。你现在只想搞钱，或者考个编制上岸。你可能是班里活得最通透的人。";
            rAbroad = "🙅 <strong>深造建议：大可不必。</strong> 别浪费钱读水硕了，省下钱来理财或考公吧。";
        }

        // 5. 六边形战士 (默认)
        else {
            rType = "THE ALL-ROUNDER";
            rTitle = "六边形战士·保研苗子";
            rDesc = "你的综测分应该挺高的。你既能画图，又能写论文，还能做 Pre。你是老师眼中的好学生。你的适应力很强，无论去哪里都能混得不错。";
            rAbroad = "🎓 <strong>深造建议：镀金策略。</strong> 出国对你来说是锦上添花，去个名校提升一下背景即可。";
        }

        document.getElementById('res-type').innerText = rType;
        document.getElementById('res-title').innerText = rTitle;
        document.getElementById('res-desc').innerHTML = rDesc;
        document.getElementById('res-abroad').innerHTML = rAbroad;
    }
</script>
